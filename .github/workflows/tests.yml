name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test parsers and local HTTP transport
        run: python -m unittest discover -s tests -v
      - name: Exercise the offline classroom demo
        run: python wp_telltale.py --demo --out ci-output/single-demo
      - name: Exercise the offline batch report
        run: python wp_telltale.py --demo-batch --out ci-output/batch-demo
